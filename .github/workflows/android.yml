name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'phone'
        type: choice
        options:
          - 'phone'
          - 'both'

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Build Cache
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Setup ccache for Native C++
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-android-ccache
        max-size: 500M

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: |
        TARGET="${{ github.event.inputs.target || (github.ref == 'refs/heads/main' && 'both') || 'phone' }}"
        GRADLE_FLAGS="--parallel --build-cache -Dorg.gradle.workers.max=4 -DANDROID_CCACHE=ccache"
        if [ "$TARGET" = "both" ]; then
          echo "Building both Phone and Wear OS APKs..."
          ./gradlew assembleProdRelease $GRADLE_FLAGS
        else
          echo "Building Phone Release APK (:app:assembleProdArm64-v8aRelease)..."
          ./gradlew :app:assembleProdArm64-v8aRelease $GRADLE_FLAGS
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      if: github.event.inputs.target == 'both' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk